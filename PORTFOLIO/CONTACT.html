<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
        <nav>
            <a href="./HOME.html">Home</a>
            <a href="./ABOUT.html">About</a>
            <a href="./EDUCATION.html">Education</a>
            <a href="./EXPERIENCE.html">Experience</a>
            <a href="./HOBBIES.html">Hobbies</a>
            <a class="active" href="./CONTACT.html">Contact</a>
        </nav>
    </header>

    <main>
        <section id="contact">
            <h2>Contact Me</h2>

            <div class="contact-details">
                <div class="contact-card">
                    <strong>Email</strong>
                    <p>ridafatima786findtrip@gmail.com</p>
                </div>
                <div class="contact-card">
                    <strong>Phone</strong>
                    <p>+1234567890</p>
                </div>
            </div>

            <form action="https://formsubmit.co/ridafatima786findtrip@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New portfolio contact message">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="Student">Student</option>
                        <option value="Professional">Professional</option>
                        <option value="Employer">Employer</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>How did you hear about me?</label>
                    <div class="option-group">
                        <label><input type="checkbox" name="source" value="Social Media"> Social Media</label>
                        <label><input type="checkbox" name="source" value="Friend or Family"> Friend or Family</label>
                        <label><input type="checkbox" name="source" value="Search Engine"> Search Engine</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Preferred contact method</label>
                    <div class="option-group">
                        <label><input type="radio" name="contact_method" value="Email" required> Email</label>
                        <label><input type="radio" name="contact_method" value="Phone"> Phone</label>
                        <label><input type="radio" name="contact_method" value="Meeting"> Meeting</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message" required></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>
</body>
</html>
